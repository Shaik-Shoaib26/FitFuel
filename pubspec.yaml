name: fitfuel
description: "FitFuel - AI-Powered Nutrition, Calorie Tracking & Healthy Eating Assistant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Firebase Ecosystem
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.0
  firebase_messaging: ^14.9.0
  firebase_analytics: ^10.10.0
  firebase_crashlytics: ^3.5.0

  # Networking & HTTP
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Storage & Security
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0

  # Hardware & Media
  camera: ^0.10.5+9
  image_picker: ^1.1.1

  # UI, Charts & Design System
  fl_chart: ^0.67.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Logging & Utilities
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
  assets:
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/Outfit-OFL.txt
    - .env
    - .env.example
    - assets/images/foods/
    - assets/data/
